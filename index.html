<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Play Arcade: Husnain Edition</title>

<style>
  * { box-sizing: border-box; }

  body{
    background:#0d1117;
    color:#ffffff;
    font-family:system-ui,sans-serif;
    margin:0;
    padding:20px 0 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }

  #scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#161b22;
    padding:12px 20px;
    border-radius:12px 12px 0 0;
    border-bottom:2px solid #21262d;
    font-size:18px;
    font-weight:bold;
    gap:10px;
  }

  #scoreboard .combo{
    color:#ff9800;
    font-size:13px;
    min-width:70px;
    text-align:center;
  }

  .canvas-container{
    position:relative;
    box-shadow:0 0 30px rgba(255,0,0,.6);
    border-radius:0 0 12px 12px;
  }

  canvas{
    border-radius:0 0 12px 12px;
    display:block;
    touch-action:none;
  }

  .controls-bar{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:#8b949e;
  }

  .controls-bar button, .controls-bar select{
    background:#161b22;
    color:#ffffff;
    border:1px solid #30363d;
    border-radius:6px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
  }

  .controls-bar button:hover{
    filter:brightness(1.3);
  }

  .author-tag{
    font-weight:bold;
    letter-spacing:1px;
    color:#8b949e;
  }

  .volume-wrap{
    display:flex;
    align-items:center;
    gap:4px;
  }

  input[type="range"]{
    width:70px;
  }

  /* ---------- Leaderboard ---------- */
  #leaderboardSection{
    margin-top:26px;
    width:706px;
    max-width:95vw;
    background:#161b22;
    border:1px solid #21262d;
    border-radius:12px;
    padding:16px 18px;
  }

  #leaderboardSection h2{
    margin:0 0 4px;
    font-size:18px;
    color:#58a6ff;
  }

  #leaderboardSection .lb-sub{
    margin:0 0 12px;
    font-size:12px;
    color:#8b949e;
  }

  .leaderboard-scroll{
    max-height:280px;
    overflow-y:auto;
    border:1px solid #21262d;
    border-radius:8px;
  }

  #leaderboardTable{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }

  #leaderboardTable thead th{
    position:sticky;
    top:0;
    background:#1c2129;
    color:#8b949e;
    text-align:left;
    padding:10px 12px;
    font-size:11px;
    letter-spacing:.8px;
    text-transform:uppercase;
    border-bottom:1px solid #30363d;
  }

  #leaderboardTable tbody tr{
    transition:background .12s;
  }

  #leaderboardTable tbody tr:nth-child(odd){
    background:rgba(255,255,255,.015);
  }

  #leaderboardTable tbody tr:hover{
    background:rgba(88,166,255,.08);
  }

  #leaderboardTable tbody td{
    padding:9px 12px;
    border-top:1px solid #21262d;
    color:#e6edf3;
    vertical-align:middle;
  }

  .lb-rank{
    font-weight:bold;
    color:#8b949e;
    width:28px;
  }

  .lb-player{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .lb-avatar{
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    color:#0d1117;
    background:#58a6ff;
  }

  .lb-score{
    font-weight:bold;
    color:#3fb950;
  }

  #leaderboardTable tbody tr:nth-child(1) .lb-rank{ color:#ffd700; }
  #leaderboardTable tbody tr:nth-child(1) .lb-avatar{ background:#ffd700; }
  #leaderboardTable tbody tr:nth-child(1) .lb-score{ color:#ffd700; }

  #leaderboardTable tbody tr:nth-child(2) .lb-rank{ color:#c0c0c0; }
  #leaderboardTable tbody tr:nth-child(2) .lb-avatar{ background:#c0c0c0; }
  #leaderboardTable tbody tr:nth-child(2) .lb-score{ color:#c0c0c0; }

  #leaderboardTable tbody tr:nth-child(3) .lb-rank{ color:#cd7f32; }
  #leaderboardTable tbody tr:nth-child(3) .lb-avatar{ background:#cd7f32; }
  #leaderboardTable tbody tr:nth-child(3) .lb-score{ color:#cd7f32; }

  .lb-empty, .lb-error{
    padding:14px;
    text-align:center;
    color:#8b949e;
    font-size:13px;
  }

  .lb-error{ color:#ff6b6b; }

  /* ---------- Username modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }

  .modal-box{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:24px 26px;
    width:300px;
    max-width:90vw;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }

  .modal-box h3{
    margin:0 0 8px;
    color:#ffda6a;
  }

  .modal-box p{
    margin:0 0 14px;
    font-size:13px;
    color:#8b949e;
  }

  .modal-box input{
    width:100%;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#fff;
    font-size:14px;
    margin-bottom:12px;
  }

  .modal-box button{
    width:100%;
    padding:9px 0;
    border-radius:6px;
    border:none;
    background:#238636;
    color:#fff;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
  }

  .modal-box button:hover{
    background:#2ea043;
  }
</style>

</head>

<body>

<div id="scoreboard">
  <div style="color:#ffda6a;">🍎 <span id="score">0</span></div>
  <div class="combo" id="combo"></div>
  <div style="color:#58a6ff;font-size:13px;letter-spacing:1px;">ARCADE</div>
  <div style="color:#3fb950;">🏆 <span id="highScore">0</span></div>
</div>

<div class="canvas-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="controls-bar">
  <span class="author-tag">MADE BY HUSNAIN</span>

  <button id="nameBtn">👤 Name</button>

  <select id="mapSelect">
    <option value="small">Small map</option>
    <option value="medium" selected>Medium map</option>
    <option value="large">Large map</option>
  </select>

  <select id="skinSelect"></select>

  <select id="speedSelect">
    <option value="0.10">Easy</option>
    <option value="0.16" selected>Normal</option>
    <option value="0.24">Hard</option>
    <option value="0.34">Insane</option>
  </select>

  <button id="muteBtn">🔊 SFX</button>

  <div class="volume-wrap">
    <button id="musicBtn">🎵 Music</button>
    <input type="range" id="musicVol" min="0" max="100" value="40">
  </div>

  <button id="pauseBtn">⏸ Pause (P)</button>
</div>

<div id="leaderboardSection">
  <h2>🌍 Global Leaderboard</h2>
  <p class="lb-sub">Top 50 scores from every player, worldwide, live from Firebase.</p>
  <div class="leaderboard-scroll">
    <table id="leaderboardTable">
      <thead>
        <tr><th>#</th><th>Name</th><th>Map</th><th>Difficulty</th><th>Score</th></tr>
      </thead>
      <tbody id="leaderboardBody">
        <tr><td colspan="5" class="lb-empty">Loading leaderboard…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Username entry modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <h3>Welcome, arcade player!</h3>
    <p>Enter a username (max 10 characters) to appear on the global leaderboard.</p>
    <input id="nameInput" maxlength="10" placeholder="e.g. Husnain" autocomplete="off">
    <button id="nameSubmitBtn">Let's go</button>
  </div>
</div>

<script type="module">
/* ============================================================================
   SECURITY NOTES — READ BEFORE DEPLOYING
   ----------------------------------------------------------------------------
   Everything below (grid-limit checks, in-memory score validation, variable
   renaming) runs in the PLAYER'S OWN BROWSER. It stops casual tampering and
   catches obvious console/cheat-engine edits, but anyone can still open
   devtools, disable JS breakpoints, or fire a raw HTTPS request straight at
   Firestore with a fabricated score — client code can never truly stop that.

   The only durable fix is to mirror these same caps in Firestore Security
   Rules (Firebase Console → Firestore Database → Rules), so the SERVER
   rejects any write that violates them, e.g.:

     match /leaderboard/{playerId} {
       allow read: if true;
       allow write: if request.resource.data.score is int
         && request.resource.data.score > 0
         && request.resource.data.score <= (
              request.resource.data.mapSize == 'small'  ? 400  :
              request.resource.data.mapSize == 'medium' ? 700  :
              request.resource.data.mapSize == 'large'   ? 1200 : 0
            );
     }

   Keep the numbers 400 / 700 / 1200 identical here and in the rule above —
   if they ever drift apart, the client and server will disagree and either
   reject legit scores or let cheated ones through. Consider also adding a
   Cloud Function with App Check to rate-limit writes per player.
   ============================================================================ */

  // ================= Firebase setup =================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, serverTimestamp,
    query, orderBy, limit, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDivTahL5W64LbD429u-Z_-pINwu8RS1YM",
    authDomain: "leaderboard-b0ff9.firebaseapp.com",
    projectId: "leaderboard-b0ff9",
    storageBucket: "leaderboard-b0ff9.firebasestorage.app",
    messagingSenderId: "778795650458",
    appId: "1:778795650458:web:95826b9e98c54ec17bbe23",
    measurementId: "G-E5EJ4NMGF0"
  };

  let db = null;
  try { const _a = initializeApp(firebaseConfig); db = getFirestore(_a); }
  catch (e) { console.warn("Firebase failed to initialize — leaderboard will be unavailable.", e); }

  // Upgrade #1: dynamic grid-limit table. Cells = cols*rows; caps below are the
  // designer-supplied theoretical max score for a perfect run on each map.
  const MAP_GRIDS = { small: { cols: 16, rows: 11 }, medium: { cols: 22, rows: 15 }, large: { cols: 28, rows: 19 } };
  const MAP_SCORE_CAPS = { small: 400, medium: 700, large: 1200 };

  function gridCells(m) { const g = MAP_GRIDS[m]; return g ? g.cols * g.rows : 0; }

  function getPlayerId() {
    let id = localStorage.getItem("playerId");
    if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem("playerId", id); }
    return id;
  }

  async function submitScoreToCloud(name, score, mapSize, difficulty) {
    if (!db) return;

    // --- Upgrade #1: reject anything above the physical/theoretical max for the map ---
    const cap = MAP_SCORE_CAPS[mapSize] ?? 0;
    if (!Number.isFinite(score) || score < 0 || score > cap) {
      console.warn(`[anti-cheat] rejected submission — score ${score} exceeds cap ${cap} for map "${mapSize}" (${gridCells(mapSize)} cells). Flagged as hacker.`, { name, score, mapSize, difficulty });
      flagSuspiciousClient("score_over_cap");
      return;
    }

    try {
      const pid = getPlayerId();
      const ref = doc(db, "leaderboard", pid);
      const existing = await getDoc(ref);
      const prevBest = existing.exists() ? (existing.data().score || 0) : -1;
      if (score <= prevBest) return;
      await setDoc(ref, { name, score, mapSize, difficulty, timestamp: serverTimestamp() });
    } catch (e) { console.warn("Could not submit score to leaderboard:", e); }
  }

  // Lightweight local flag so repeated cap violations are visible in devtools/analytics
  // without blocking the player from just playing a normal game afterwards.
  function flagSuspiciousClient(reason) {
    try {
      const n = (parseInt(localStorage.getItem("flagCount") || "0", 10) || 0) + 1;
      localStorage.setItem("flagCount", String(n));
      localStorage.setItem("lastFlagReason", reason);
    } catch (e) {}
  }

  const MEDALS = ["🥇", "🥈", "🥉"];

  function renderLeaderboard(rows) {
    const body = document.getElementById("leaderboardBody");
    if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="lb-empty">No scores yet — be the first!</td></tr>'; return; }
    body.innerHTML = rows.map((r, i) => {
      const name = r.name || "???";
      const initial = escapeHtml(name.charAt(0).toUpperCase());
      const rankLabel = MEDALS[i] || (i + 1);
      return `
        <tr>
          <td class="lb-rank">${rankLabel}</td>
          <td>
            <div class="lb-player">
              <span class="lb-avatar">${initial}</span>
              <span>${escapeHtml(name)}</span>
            </div>
          </td>
          <td>${escapeHtml(capitalize(r.mapSize || "-"))}</td>
          <td>${escapeHtml(r.difficulty || "-")}</td>
          <td class="lb-score">${r.score ?? 0}</td>
        </tr>
      `;
    }).join("");
  }

  function escapeHtml(str) { return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function startLeaderboardListener() {
    if (!db) { document.getElementById("leaderboardBody").innerHTML = '<tr><td colspan="5" class="lb-error">Leaderboard unavailable (Firebase did not initialize).</td></tr>'; return; }
    const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(50));
    onSnapshot(q, (snapshot) => { renderLeaderboard(snapshot.docs.map(d => d.data())); }, (err) => {
      console.warn("Leaderboard listener error:", err);
      document.getElementById("leaderboardBody").innerHTML = '<tr><td colspan="5" class="lb-error">Could not load leaderboard. Check your Firestore security rules.</td></tr>';
    });
  }
  startLeaderboardListener();

  // ================= Username modal =================
  const nameModal = document.getElementById("nameModal");
  const nameInput = document.getElementById("nameInput");
  const nameSubmitBtn = document.getElementById("nameSubmitBtn");
  const nameBtn = document.getElementById("nameBtn");

  let playerName = localStorage.getItem("playerName") || "";
  let gameStarted = false;

  function isModalOpen() { return nameModal.style.display === "flex"; }
  function showNameModal() { nameInput.value = playerName; nameModal.style.display = "flex"; setTimeout(() => nameInput.focus(), 0); }
  function hideNameModal() { nameModal.style.display = "none"; }
  function confirmName() {
    const val = nameInput.value.trim().slice(0, 10);
    if (!val) return;
    playerName = val;
    localStorage.setItem("playerName", playerName);
    hideNameModal();
    if (!gameStarted) { gameStarted = true; resetGame(); }
  }
  nameSubmitBtn.addEventListener("click", confirmName);
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmName(); });
  nameBtn.addEventListener("click", showNameModal);

  // ================= Game (core logic preserved, internals compacted) =================
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreboard = document.getElementById("scoreboard");
  const controlsBar = document.querySelector(".controls-bar");

  const scoreEl = document.getElementById("score");
  const highScoreEl = document.getElementById("highScore");
  const comboEl = document.getElementById("combo");

  const mapSelect = document.getElementById("mapSelect");
  const skinSelect = document.getElementById("skinSelect");
  const speedSelect = document.getElementById("speedSelect");
  const muteBtn = document.getElementById("muteBtn");
  const musicBtn = document.getElementById("musicBtn");
  const musicVol = document.getElementById("musicVol");
  const pauseBtn = document.getElementById("pauseBtn");

  const WALL = 3, CD0 = 3, PCOUNT = 12, COMBO_MS = 3000;

  const MAPS = { small: { cols: 16, rows: 11, cell: 32 }, medium: { cols: 22, rows: 15, cell: 28 }, large: { cols: 28, rows: 19, cell: 24 } };

  const FRUITS = [
    { emoji: "🍎", glow: "#ff1744" }, { emoji: "🍊", glow: "#ff9800" }, { emoji: "🍌", glow: "#ffee00" },
    { emoji: "🍇", glow: "#b266ff" }, { emoji: "🍐", glow: "#76ff03" }, { emoji: "🍉", glow: "#00ff66" },
    { emoji: "🍓", glow: "#ff3366" }, { emoji: "🍍", glow: "#ffd000" }, { emoji: "🍒", glow: "#ff0033" },
    { emoji: "🍑", glow: "#ff9966" }, { emoji: "🍋", glow: "#ffff00" }
  ];

  const SKINS = [
    { id: "classic", name: "Classic", unlock: 0, body: "#1a237e", eye: "#ffffff" },
    { id: "emerald", name: "Emerald", unlock: 15, body: "#00c853", eye: "#0d1117" },
    { id: "inferno", name: "Inferno", unlock: 30, body: "#d50000", eye: "#ffee00" },
    { id: "golden", name: "Golden", unlock: 60, body: "#ffab00", eye: "#3e2723" },
    { id: "void", name: "Void", unlock: 100, body: "#6a1b9a", eye: "#00e5ff" }
  ];

  let highScore = parseInt(localStorage.getItem("hHigh"), 10) || 0;
  let mapSize = localStorage.getItem("mapSize") || "medium";
  let skinId = localStorage.getItem("skinId") || "classic";
  let musicOn = localStorage.getItem("musicOn") === "true";
  let musicVolume = parseInt(localStorage.getItem("musicVol"), 10);
  if (isNaN(musicVolume)) musicVolume = 40;

  highScoreEl.textContent = highScore;

  function unlockedSkins() { return SKINS.filter(s => highScore >= s.unlock); }
  function populateSkinSelect() {
    skinSelect.innerHTML = "";
    for (const s of SKINS) {
      const unlocked = highScore >= s.unlock;
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = unlocked ? s.name : `${s.name} (score ${s.unlock}+)`;
      opt.disabled = !unlocked;
      skinSelect.appendChild(opt);
    }
    if (!unlockedSkins().some(s => s.id === skinId)) skinId = "classic";
    skinSelect.value = skinId;
  }
  function currentSkin() { return SKINS.find(s => s.id === skinId) || SKINS[0]; }
  skinSelect.addEventListener("change", () => { skinId = skinSelect.value; localStorage.setItem("skinId", skinId); });
  populateSkinSelect();

  let COLS, ROWS, CELL;
  function applyMapSize() {
    const m = MAPS[mapSize] || MAPS.medium;
    COLS = m.cols; ROWS = m.rows; CELL = m.cell;
    canvas.width = COLS * CELL + WALL * 2;
    canvas.height = ROWS * CELL + WALL * 2;
    const w = canvas.width + "px";
    scoreboard.style.width = w;
    controlsBar.style.width = w;
  }
  mapSelect.value = mapSize;
  mapSelect.addEventListener("change", () => { mapSize = mapSelect.value; localStorage.setItem("mapSize", mapSize); applyMapSize(); if (gameStarted) resetGame(); });
  applyMapSize();

  function makeSound(src) {
    let audio = null, broken = false;
    try { audio = new Audio(src); audio.volume = 0.5; } catch (e) { broken = true; }
    return { play() { if (broken || !audio || sfxMuted) return; try { audio.currentTime = 0; const p = audio.play(); if (p && typeof p.catch === "function") p.catch(() => {}); } catch (e) {} } };
  }
  const eatSound = makeSound("sounds/eat.mp3");
  const gameOverSound = makeSound("sounds/gameover.mp3");
  const winSound = makeSound("sounds/win.mp3");

  let sfxMuted = false;
  muteBtn.addEventListener("click", () => { sfxMuted = !sfxMuted; muteBtn.textContent = sfxMuted ? "🔇 SFX" : "🔊 SFX"; });

  let bgm = null;
  try {
    bgm = new Audio("sounds/bgm.mp3");
    bgm.loop = true;
    bgm.volume = musicVolume / 100;
    bgm.addEventListener("ended", () => { if (musicOn) { bgm.currentTime = 0; tryPlayMusic(); } });
  } catch (e) { bgm = null; }

  function updateMusicBtn() { musicBtn.textContent = musicOn ? "🎵 Music" : "🔈 Music"; }
  function tryPlayMusic() { if (!bgm || !musicOn) return; const p = bgm.play(); if (p && typeof p.catch === "function") p.catch(() => {}); }
  musicBtn.addEventListener("click", () => { musicOn = !musicOn; localStorage.setItem("musicOn", String(musicOn)); updateMusicBtn(); if (musicOn) tryPlayMusic(); else if (bgm) bgm.pause(); });

  musicVol.value = musicVolume;
  musicVol.addEventListener("input", () => { musicVolume = parseInt(musicVol.value, 10); localStorage.setItem("musicVol", String(musicVolume)); if (bgm) bgm.volume = musicVolume / 100; });
  updateMusicBtn();
  window.addEventListener("keydown", tryPlayMusic, { once: true });
  window.addEventListener("pointerdown", tryPlayMusic, { once: true });

  let score = 0;
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let inputQueue = [];
  let food = { x: 0, y: 0, fruit: FRUITS[0] };

  let isGameOver = false, isWin = false, isPaused = false, isCd = false, detectedHacker = false;
  let cdVal = CD0, cdTimer = null;
  let progress = 0;
  let speed = parseFloat(speedSelect.value);
  let particles = [];
  let animationId = null, lastTime = null;
  let comboCount = 0, comboTimer = 0, scoreSubmitted = false;

  // ---- Upgrade #2: in-memory integrity tracking ----
  // shadowScore/fruitsEaten are the ONLY place score is allowed to increase.
  // Every frame we check the visible `score` still equals what the game loop
  // actually earned; if a console/cheat-tool edit pokes `score` directly
  // (or bumps it without an eat event), this trips instantly.
  let shadowScore = 0;
  let fruitsEaten = 0;

  function difficultyLabel() { return speedSelect.options[speedSelect.selectedIndex].text; }

  function submitScoreIfNeeded() {
    if (scoreSubmitted) return;
    scoreSubmitted = true;
    if (detectedHacker) return; // never submit a run that failed integrity checks
    if (score <= 0) return;
    submitScoreToCloud(playerName || "Player", score, mapSize, difficultyLabel());
  }

  function triggerHackerDetected() {
    if (detectedHacker) return;
    detectedHacker = true;
    isGameOver = true;
    flagSuspiciousClient("in_memory_mismatch");
    gameOverSound.play();
    submitScoreIfNeeded();
    draw();
  }

  // Called once per frame: cheap, cheap, cheap.
  function checkIntegrity() {
    if (score !== shadowScore) triggerHackerDetected();
  }

  window.addEventListener("keydown", (e) => {
    if (isModalOpen()) return;
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    if (e.repeat) return;
    if (!isPaused && !isCd && !isGameOver && !isWin) {
      if (k === "arrowup" || k === "w") queueDir(0, -1);
      else if (k === "arrowdown" || k === "s") queueDir(0, 1);
      else if (k === "arrowleft" || k === "a") queueDir(-1, 0);
      else if (k === "arrowright" || k === "d") queueDir(1, 0);
    }
    if (k === " " && (isGameOver || isWin)) resetGame();
    if (k === "p" && !isGameOver && !isWin) { if (isCd) return; isPaused ? startCountdown() : pauseGame(); }
  });

  function queueDir(x, y) { if (inputQueue.length < 2) inputQueue.push({ x, y }); }
  function pauseGame() { isPaused = true; draw(); }
  pauseBtn.addEventListener("click", () => { if (isGameOver || isWin || isCd) return; isPaused ? startCountdown() : pauseGame(); });
  speedSelect.addEventListener("change", () => { speed = parseFloat(speedSelect.value); });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; touchStartX = t.clientX; touchStartY = t.clientY; }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (isPaused || isCd || isGameOver || isWin) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
    else queueDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  function startCountdown() {
    if (cdTimer) clearInterval(cdTimer);
    isPaused = false; isCd = true; cdVal = CD0;
    draw();
    cdTimer = setInterval(() => {
      cdVal--; draw();
      if (cdVal <= 0) { clearInterval(cdTimer); cdTimer = null; isCd = false; lastTime = null; animationId = requestAnimationFrame(loop); }
    }, 1000);
  }

  function explode(gx, gy, color) {
    const px = gx * CELL + CELL / 2 + WALL, py = gy * CELL + CELL / 2 + WALL;
    for (let i = 0; i < PCOUNT; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 2;
      particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 3 + 2, alpha: 1, dec: Math.random() * 0.03 + 0.02, color: color || "255,235,59" });
    }
  }

  function spawnFood() {
    const spots = [];
    const occupied = new Set(snake.map(c => c.x + "," + c.y));
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if (!occupied.has(x + "," + y)) spots.push({ x, y });
    if (spots.length === 0) { isWin = true; winSound.play(); submitScoreIfNeeded(); return; }
    const pick = spots[Math.floor(Math.random() * spots.length)];
    food.x = pick.x; food.y = pick.y;
    food.fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
  }

  function resetGame() {
    if (animationId) cancelAnimationFrame(animationId);
    if (cdTimer) clearInterval(cdTimer);

    score = 0; shadowScore = 0; fruitsEaten = 0;
    scoreEl.textContent = score;
    comboCount = 0; comboTimer = 0; comboEl.textContent = "";
    scoreSubmitted = false; detectedHacker = false;

    particles = []; inputQueue = [];

    const midY = Math.floor(ROWS / 2);
    snake = [{ x: 6, y: midY }, { x: 5, y: midY }, { x: 4, y: midY }, { x: 3, y: midY }];

    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    progress = 0; lastTime = null;
    isGameOver = false; isWin = false; isPaused = false; isCd = false;

    spawnFood();
    animationId = requestAnimationFrame(loop);
  }

  function updateDirection() {
    if (inputQueue.length === 0) return;
    const wanted = inputQueue.shift();
    if (wanted.x !== 0 && dir.x !== 0) return;
    if (wanted.y !== 0 && dir.y !== 0) return;
    nextDir = wanted;
  }

  function hitsSnake(x, y, length) { for (let i = 0; i < length; i++) if (snake[i].x === x && snake[i].y === y) return true; return false; }

  function endGame() { isGameOver = true; gameOverSound.play(); progress = 1; submitScoreIfNeeded(); }
  function hexToRgb(hex) { const n = parseInt(hex.replace("#", ""), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; }

  function advanceGridStep() {
    updateDirection();
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }

    const eating = head.x === food.x && head.y === food.y;
    const checkLength = eating ? snake.length : snake.length - 1;
    if (hitsSnake(head.x, head.y, checkLength)) { endGame(); return; }

    snake.unshift(head);

    if (eating) {
      eatSound.play();
      fruitsEaten++;

      if (comboTimer > 0) comboCount++; else comboCount = 1;
      comboTimer = COMBO_MS;

      const gained = 1 + Math.max(0, comboCount - 1);

      // Upgrade #2: shadowScore is the single source of truth for what the
      // player actually earned this frame. `score` is only ever set FROM it.
      shadowScore += gained;
      score = shadowScore;
      scoreEl.textContent = score;

      explode(food.x, food.y, hexToRgb(food.fruit.glow));

      if (score > highScore) { highScore = score; localStorage.setItem("hHigh", String(highScore)); highScoreEl.textContent = highScore; populateSkinSelect(); }

      spawnFood();
    } else {
      snake.pop();
    }
  }

  function loop(timestamp) {
    if (isGameOver || isWin || isPaused || isCd) { draw(); return; }

    if (lastTime === null) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 250) dt = 16.7;

    const stepsPerMs = speed / 16.7;
    progress += dt * stepsPerMs;

    let stepsThisFrame = 0;
    while (progress >= 1 && stepsThisFrame < 5) {
      progress -= 1;
      advanceGridStep();
      stepsThisFrame++;
      if (isGameOver || isWin) break;
    }

    // Upgrade #2: integrity check every frame. Any external tampering with
    // `score` that doesn't go through the eat-fruit path above is caught here.
    checkIntegrity();
    if (detectedHacker) return;

    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { comboTimer = 0; comboCount = 0; } }
    comboEl.textContent = comboCount > 1 ? `x${comboCount} combo!` : "";

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.alpha -= p.dec;
      if (p.alpha <= 0) particles.splice(i, 1);
    }

    draw();
    animationId = requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(WALL, WALL);

    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) { ctx.fillStyle = (c + r) % 2 === 0 ? "#aad751" : "#4a752c"; ctx.fillRect(c * CELL, r * CELL, CELL, CELL); }

    if (!isWin) {
      ctx.shadowBlur = 20; ctx.shadowColor = food.fruit.glow;
      ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(food.fruit.emoji, food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 2);
      ctx.shadowBlur = 0;
    }

    if (snake.length > 0) {
      const skin = currentSkin();
      ctx.strokeStyle = skin.body; ctx.lineWidth = CELL - 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();

      const p = (isGameOver || isWin) ? 1 : progress;
      const first = snake[0], second = snake[1] || first;
      const startX = (second.x + (first.x - second.x) * p) * CELL + CELL / 2;
      const startY = (second.y + (first.y - second.y) * p) * CELL + CELL / 2;
      ctx.moveTo(startX, startY);

      for (let i = 1; i < snake.length; i++) {
        const current = snake[i], prev = snake[i - 1];
        let x, y;
        if (i === snake.length - 1) { x = (current.x + (prev.x - current.x) * p) * CELL + CELL / 2; y = (current.y + (prev.y - current.y) * p) * CELL + CELL / 2; }
        else { x = current.x * CELL + CELL / 2; y = current.y * CELL + CELL / 2; }
        ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.fillStyle = skin.eye;
      ctx.beginPath();
      if (dir.x === 1) { ctx.arc(startX + 8, startY - 7, 3, 0, Math.PI * 2); ctx.arc(startX + 8, startY + 7, 3, 0, Math.PI * 2); }
      else if (dir.x === -1) { ctx.arc(startX - 8, startY - 7, 3, 0, Math.PI * 2); ctx.arc(startX - 8, startY + 7, 3, 0, Math.PI * 2); }
      else if (dir.y === 1) { ctx.arc(startX - 7, startY + 8, 3, 0, Math.PI * 2); ctx.arc(startX + 7, startY + 8, 3, 0, Math.PI * 2); }
      else if (dir.y === -1) { ctx.arc(startX - 7, startY - 8, 3, 0, Math.PI * 2); ctx.arc(startX + 7, startY - 8, 3, 0, Math.PI * 2); }
      ctx.fill();
    }

    ctx.restore();

    for (const p of particles) { ctx.fillStyle = `rgba(${p.color},${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }

    ctx.shadowBlur = 15;
    ctx.shadowColor = detectedHacker ? "#ff0000" : (isWin ? "#3fb950" : "#ff0000");
    ctx.strokeStyle = ctx.shadowColor;
    ctx.lineWidth = WALL;
    ctx.strokeRect(WALL / 2, WALL / 2, canvas.width - WALL, canvas.height - WALL);
    ctx.shadowBlur = 0;

    if (isPaused || isGameOver || isCd || isWin) {
      ctx.fillStyle = "rgba(0,0,0,.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";

      if (isPaused) { ctx.fillStyle = "#ffffff"; ctx.font = "bold 36px sans-serif"; ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2); }
      if (isCd) { ctx.fillStyle = "#ffda6a"; ctx.font = "bold 64px sans-serif"; ctx.fillText(cdVal, canvas.width / 2, canvas.height / 2); }

      if (isGameOver && detectedHacker) {
        // Upgrade #2: dedicated hacker-detected overlay, distinct from a normal game over.
        ctx.fillStyle = "#ff1744";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText("⚠ HACKER DETECTED ⚠", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "14px sans-serif";
        ctx.fillText("Score integrity check failed — run discarded", canvas.width / 2, canvas.height / 2 + 12);
        ctx.font = "13px sans-serif";
        ctx.fillStyle = "#8b949e";
        ctx.fillText("PRESS SPACEBAR TO RESTART", canvas.width / 2, canvas.height / 2 + 38);
      } else if (isGameOver) {
        ctx.fillStyle = "#ff0000"; ctx.font = "bold 42px sans-serif"; ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif"; ctx.fillText("PRESS SPACEBAR TO RESTART", canvas.width / 2, canvas.height / 2 + 25);
      }

      if (isWin) {
        ctx.fillStyle = "#3fb950"; ctx.font = "bold 42px sans-serif"; ctx.fillText("YOU WIN!", canvas.width / 2, canvas.height / 2 - 25);
        ctx.fillStyle = "#ffda6a"; ctx.font = "bold 20px sans-serif"; ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif"; ctx.fillText("PRESS SPACEBAR TO RESTART", canvas.width / 2, canvas.height / 2 + 40);
      }
    }
  }

  // ================= Boot =================
  if (playerName) { gameStarted = true; resetGame(); }
  else { draw(); showNameModal(); }
</script>

</body>
</html>
